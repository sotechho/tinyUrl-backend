<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f7fb;
        font-family: Arial, Helvetica, sans-serif;
        color: #172033;
        line-height: 1.6;
      }

      .email-wrapper {
        width: 100%;
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border: 1px solid #e8ecf3;
        border-radius: 12px;
        overflow: hidden;
      }

      /* Header */
      .email-header {
        background-color: #111827;
        padding: 28px 30px;
        text-align: center;
      }

      .brand {
        margin: 0;
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .brand span {
        color: #3b82f6;
      }

      /* Body */
      .email-body {
        padding: 40px 36px;
        font-size: 15px;
      }

      .email-body h2 {
        margin: 0 0 18px;
        color: #111827;
        font-size: 22px;
        line-height: 1.3;
      }

      .email-body p {
        margin: 14px 0;
      }

      /* Button */
      .button {
        display: inline-block;
        margin: 22px 0;
        padding: 12px 24px;
        background-color: #2563eb;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
      }

      .button:hover {
        background-color: #1d4ed8;
      }

      /* Links */
      .link-url {
        word-break: break-all;
        color: #2563eb;
        font-size: 12px;
      }

      .text-muted {
        color: #6b7280;
        font-size: 13px;
      }

      /* Footer */
      .email-footer {
        padding: 24px 30px;
        background-color: #f9fafb;
        border-top: 1px solid #e5e7eb;
        text-align: center;
      }

      .email-footer p {
        margin: 5px 0;
        color: #6b7280;
        font-size: 12px;
      }

      .email-footer .brand-footer {
        color: #111827;
        font-weight: 600;
        font-size: 13px;
      }

      /* Mobile */
      @media only screen and (max-width: 600px) {
        .email-wrapper {
          margin: 0;
          border: none;
          border-radius: 0;
        }

        .email-header {
          padding: 24px 20px;
        }

        .email-body {
          padding: 30px 22px;
        }

        .email-body h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-wrapper">
      <div class="email-header">
        <h1 class="brand">Link<span>ora</span></h1>
      </div>

      <div class="email-body">{{content}}</div>

      <div class="email-footer">
        <p class="brand-footer">Linkora</p>

        <p>Simple links. Smarter sharing.</p>

        <p class="text-muted">
          This is an automated email. Please do not reply.
        </p>
      </div>
    </div>
  </body>
</html>
